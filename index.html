<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Gelişmiş Market Sistemi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(16, 16, 16, 0.9), rgba(25, 25, 25, 0.9)), url('https://minecraft.net');
            background-repeat: repeat; color: #e0e0e0; text-align: center; padding: 30px; margin: 0;
        } 
        .container {
            max-width: 600px; margin: 0 auto; background: rgba(35, 35, 35, 0.95); padding: 30px; border-radius: 12px; border: 3px solid #4a4a4a; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }
        h2 { color: #55ff55; text-shadow: 2px 2px #004400; margin-top: 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; text-align: left; color: #aaa; font-size: 16px; margin-top: 15px;}
        input, select { 
            display: block; margin-bottom: 20px; padding: 12px; width: 100%; box-sizing: border-box; background: #1a1a1a; color: #fff; border: 2px solid #555; border-radius: 6px; font-size: 15px;
        }
        input:focus, select:focus { border-color: #55ff55; outline: none; }
        .info-box { background: rgba(255, 170, 0, 0.1); border-left: 4px solid #ffaa00; padding: 12px; margin: 20px 0; text-align: left; font-size: 14px; border-radius: 0 6px 6px 0; }
        button { 
            padding: 14px 20px; background: #00aa00; color: white; border: none; border-bottom: 4px solid #004400; border-radius: 6px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; text-shadow: 1px 1px #002200;
        }
        button:hover { background: #55ff55; color: #000; border-bottom: 4px solid #00aa00; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⛏️ Sunucu Sipariş Merkezi ⚔️</h2>
        <p style="color: #aaa;">Ürünleri seçin ve oyun içi teslimat için sipariş verin.</p>
        
        <form id="orderForm">
            <label for="username">Minecraft Kullanıcı Adınız:</label>
            <input type="text" id="username" placeholder="Örn: WeriqX, selimk, kenobi3761" required autocomplete="off">

            <label for="address">Teslimat Konumu (Koordinat veya Bölge):</label>
            <input type="text" id="address" placeholder="Örn: X:145 Z:-300 veya Ana Depo Önü" required>
            
            <label for="product">Almak İstediğiniz Ürün:</label>
            <select id="product">
                <optgroup label="⚔️ En İyi Büyülü Aletler (Fiyat: 3 Elmas)">
                    <option value="En İyi Büyülü Kılıç -> [3 Elmas]">En İyi Büyülü Kılıç (Keskinlik V, Ganimet III...)</option>
                    <option value="En İyi Büyülü Kazma -> [3 Elmas]">En İyi Büyülü Kazma (Verimlilik V, Servet III...)</option>
                    <option value="En İyi Büyülü Kürek -> [3 Elmas]">En İyi Büyülü Kürek (Verimlilik V, İpeksi...)</option>
                    <option value="En İyi Büyülü Balta -> [3 Elmas]">En İyi Büyülü Balta (Verimlilik V, Keskinlik V...)</option>
                    <option value="En İyi Büyülü Çapa -> [3 Elmas]">En İyi Büyülü Çapa (Verimlilik V, Kırılmazlık III)</option>
                </optgroup>
                <optgroup label="🧱 Temel Bloklar (Fiyat: Demir)">
                    <option value="1 Slot Toprak -> [10 Demir]">1 Slot Toprak (Fiyat: 10 Demir)</option>
                    <option value="1 Slot Kum -> [15 Demir]">1 Slot Kum (Fiyat: 15 Demir)</option>
                    <option value="1 Slot Çakıl -> [15 Demir]">1 Slot Çakıl (Fiyat: 15 Demir)</option>
                    <option value="1 Slot Beton -> [30 Demir]">1 Slot Beton (Fiyat: 30 Demir)</option>
                </optgroup>
            </select>

            <div class="info-box">
                <strong>💰 Güvenli Oyun İçi Ticaret:</strong><br>
                Ödemeniz gereken <strong>Elmas</strong> veya <strong>Demir</strong> miktarını envanterinizde hazır bulundurun. Yetkili yanınıza geldiğinde tahsil edilecektir.
            </div>

            <button type="submit">🛒 Siparişi Tamamla</button>
        </form>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    address: document.getElementById('address').value,
                    product: document.getElementById('product').value
                })
            });
            if(res.ok) {
                alert('Siparişiniz başarıyla sisteme gönderildi! Yetkili oyundan yanınıza gelecektir.');
                document.getElementById('address').value = '';
            } else {
                alert('Bir hata oluştu, lütfen tekrar deneyin.');
            }
        });
    </script>
</body>
</html>
