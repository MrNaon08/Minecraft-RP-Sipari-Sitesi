<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli - Sipariş Yönetimi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(16, 16, 16, 0.95), rgba(25, 25, 25, 0.95)), url('https://minecraft.net');
            background-repeat: repeat; color: #fff; padding: 30px; margin: 0;
        } 
        .admin-container {
            max-width: 900px; margin: 0 auto; background: rgba(30, 30, 30, 0.95); padding: 25px; border-radius: 12px; border: 3px solid #ffaa00; box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        h2 { color: #ffaa00; text-shadow: 2px 2px #442200; margin-top: 0; text-align: center; }
        .nav-box { display: flex; justify-content: space-between; margin-bottom: 20px; }
        button { 
            padding: 10px 20px; background: #222; color: #ffaa00; border: 2px solid #ffaa00; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #ffaa00; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #151515; border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid #333; padding: 14px; text-align: left; }
        th { background-color: #222; color: #ffaa00; font-weight: bold; }
        tr:nth-child(even) { background-color: #1c1c1c; }
        .delete-btn { background: #aa0000; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .delete-btn:hover { background: #ff5555; }
    </style>
</head>
<body>
    <div class="admin-container" id="mainContent" style="display:none;">
        <h2>👑 Gelen Sipariş Listesi (Yönetici Paneli)</h2>
        <div class="nav-box">
            <button onclick="loadOrders()">🔄 Listeyi Yenile</button>
            <button onclick="window.location.href='/'" style="border-color:#55ff55; color:#55ff55;">🛒 Markete Git</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Zaman</th>
                    <th>Oyuncu</th>
                    <th>Konum</th>
                    <th>Ürün (Fiyat)</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="orderList"></tbody>
        </table>
    </div>

    <script>
        // Şifre Giriş Kontrolü
        const sifre = prompt("Lütfen Admin Giriş Şifresini Yazın:");
        if (sifre !== "1108") {
            alert("Hatalı şifre! Giriş engellendi.");
            window.location.href = "/";
        } else {
            document.getElementById('mainContent').style.display = "block";
            loadOrders();
            setInterval(loadOrders, 5000); // 5 saniyede bir otomatik yenileme
        }

        async function loadOrders() {
            const res = await fetch(`https://onrender.com`);
            const orders = await res.json();
            const list = document.getElementById('orderList');
            list.innerHTML = '';

            if (orders.length === 0) {
                list.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa;">Henüz sipariş yok.</td></tr>';
                return;
            }

            orders.reverse().forEach(o => {
                list.innerHTML += `<tr>
                    <td style="color: #aaa;">${new Date(o.date).toLocaleTimeString()}</td>
                    <td style="color:#55ff55; font-weight:bold;">${o.username}</td>
                    <td>${o.address}</td>
                    <td style="color:#ffff55;">${o.product}</td>
                    <td><button class="delete-btn" onclick="deleteOrder('${o.id}')">✕ Teslim Edildi (Sil)</button></td>
                </tr>`;
            });
        }

        async function deleteOrder(orderId) {
            const res = await fetch(`https://onrender.com/${orderId}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                loadOrders(); // Listeyi anında yeniler
            } else {
                alert("Sipariş silinirken hata oluştu.");
            }
        }
    </script>
</body>
</html>
