<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Gelişmiş Sipariş Merkezi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(16, 16, 16, 0.9), rgba(25, 25, 25, 0.9)), url('https://minecraft.net');
            background-repeat: repeat; color: #e0e0e0; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        } 
        .container {
            width: 100%; max-width: 550px; background: rgba(35, 35, 35, 0.95); padding: 35px; border-radius: 12px; border: 4px solid #4a4a4a; box-shadow: 0 8px 24px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        h2 { color: #55ff55; text-shadow: 2px 2px #004400; margin-top: 0; font-size: 28px; }
        h3 { color: #ffaa00; text-shadow: 1px 1px #000; margin-top: 0; }
        label { display: block; font-weight: bold; margin-bottom: 8px; text-align: left; color: #aaa; font-size: 16px; }
        input, select { 
            display: block; margin-bottom: 20px; padding: 14px; width: 100%; box-sizing: border-box; background: #1a1a1a; color: #fff; border: 2px solid #555; border-radius: 6px; font-size: 16px;
        }
        input:focus, select:focus { border-color: #55ff55; outline: none; }
        button { 
            padding: 15px 20px; background: #00aa00; color: white; border: none; border-bottom: 4px solid #004400; border-radius: 6px; cursor: pointer; width: 100%; font-size: 20px; font-weight: bold; text-shadow: 1px 1px #002200;
        }
        button:hover { background: #55ff55; color: #000; border-bottom: 4px solid #00aa00; }
        .info-box { background: rgba(255, 170, 0, 0.1); border-left: 4px solid #ffaa00; padding: 12px; margin: 20px 0; text-align: left; font-size: 14px; border-radius: 0 6px 6px 0; }
        .error-message { color: #ff5555; font-weight: bold; margin-bottom: 15px; font-size: 16px; display: none; }
        .admin-link { display: block; margin-top: 15px; color: #ffaa00; text-decoration: none; font-weight: bold; font-size: 15px; }
        .admin-link:hover { color: #fff; }
    </style>
</head>
<body>

    <!-- 1. EKRAN: GİRİŞ EKRANI -->
    <div class="container" id="loginScreen">
        <h2>⛏️ Market Girişi ⚔️</h2>
        <div id="errorBox" class="error-message"></div>
        <form id="loginForm">
            <label>Minecraft Kullanıcı Adı:</label>
            <input type="text" id="username" placeholder="WeriqX" required autocomplete="off">
            <label>Şifre:</label>
            <input type="password" id="password" placeholder="••••" required>
            <button type="submit" id="loginBtn">Giriş Yap</button>
        </form>
    </div>

    <!-- 2. EKRAN: SİPARİŞ VERME EKRANI (BAŞTA GİZLİ) -->
    <div class="container" id="marketScreen" style="display: none;">
        <h2>⛏️ Sunucu Sipariş Merkezi ⚔️</h2>
        <p>Hoş geldin, <strong style="color: #ffff55;" id="userDisplay"></strong>!</p>
        
        <form id="orderForm">
            <label>Teslimat Konumu (Koordinat veya Bölge):</label>
            <input type="text" id="address" placeholder="Örn: X:145 Z:-300 veya Ana Depo Önü" required>
            
            <label>Almak İstediğiniz Ürün:</label>
            <select id="product">
                <optgroup label="⚔️ En İyi Büyülü Aletler (Fiyat: 3 Elmas)">
                    <option value="En İyi Büyülü Kılıç -> [3 Elmas]">En İyi Büyülü Kılıç (Keskinlik V, Ganimet III...)</option>
                    <option value="En İyi Büyülü Kazma -> [3 Elmas]">En İyi Büyülü Kazma (Verimlilik V, Servet III...)</option>
                    <option value="En İyi Büyülü Kürek -> [3 Elmas]">En İyi Büyülü Kürek (Verimlilik V, İpeksi...)</option>
                    <option value="En İyi Büyülü Balta -> [3 Elmas]">En İyi Büyülü Balta (Verimlilik V, Keskinlik V...)</option>
                    <option value="En İyi Büyülü Çapa -> [3 Elmas]">En İyi Büyülü Çapa (Verimlilik V, Kırılmazlık III)</option>
                </optgroup>
                <optgroup label="🧱 Temel Bloklar (Fiyat: Demir)">
                    <option value="1 Slot Toprak -> [10 Demir]">1 Slot Toprak (Fiyat: 10 Demir)</option>
                    <option value="1 Slot Kum -> [15 Demir]">1 Slot Kum (Fiyat: 15 Demir)</option>
                    <option value="1 Slot Çakıl -> [15 Demir]">1 Slot Çakıl (Fiyat: 15 Demir)</option>
                    <option value="1 Slot Beton -> [30 Demir]">1 Slot Beton (Fiyat: 30 Demir)</option>
                </optgroup>
            </select>

            <div class="info-box">
                <strong>💰 Güvenli Oyun İçi Ticaret:</strong><br>
                Ödemeniz gereken Elmas veya Demir miktarını envanterinizde hazır bulundurun. Teslimatta alınacaktır.
            </div>

            <button type="submit">🛒 Siparişi Gönder</button>
        </form>
        <a href="/admin.html" id="adminPanelLink" class="admin-link" style="display: none;">👑 Yönetici Paneline Git</a>
    </div>

    <script>
        let currentLoggedInUser = "";

        // GİRİŞ İŞLEMİ
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = "none";

            const res = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();

            if (res.ok) {
                currentLoggedInUser = data.username;
                // Ekranları değiştir
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('marketScreen').style.display = "block";
                document.getElementById('userDisplay').innerText = data.username;

                // Giriş yapan WeriqX ise admin linkini göster
                if (data.role === 'admin') {
                    document.getElementById('adminPanelLink').style.display = "block";
                }
            } else {
                errorBox.innerText = data.message;
                errorBox.style.display = "block";
            }
        });

        // SİPARİŞ VERME İŞLEMİ
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentLoggedInUser,
                    address: document.getElementById('address').value,
                    product: document.getElementById('product').value
                })
            });
            if(res.ok) {
                alert('Siparişiniz başarıyla alındı!');
                document.getElementById('address').value = '';
            }
        });
    </script>
</body>
</html>
