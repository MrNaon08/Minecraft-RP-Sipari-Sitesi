<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Market - Giriş Yap</title>
    <style>
        /* Minecraft Temalı ve Büyük Tasarım */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(16, 16, 16, 0.9), rgba(25, 25, 25, 0.9)), url('https://minecraft.net');
            background-repeat: repeat; 
            color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        } 

        .login-container {
            width: 100%;
            max-width: 500px; /* Giriş kutusu genişletildi */
            background: rgba(35, 35, 35, 0.95); 
            padding: 40px; /* İç boşluklar büyütüldü */
            border-radius: 12px; 
            border: 4px solid #4a4a4a;
            box-shadow: 0 12px 36px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h2 { 
            color: #55ff55; 
            text-shadow: 2px 2px #004400; 
            margin-top: 0; 
            font-size: 32px; /* Yazı boyutu büyütüldü */
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 18px;
        }

        input { 
            display: block; 
            margin-bottom: 25px; 
            padding: 15px; /* Giriş alanları büyütüldü */
            width: 100%; 
            box-sizing: border-box; 
            background: #1a1a1a; 
            color: #fff; 
            border: 2px solid #555; 
            border-radius: 6px; 
            font-size: 18px; /* Yazı boyutu büyütüldü */
        }

        input:focus { 
            border-color: #55ff55; 
            outline: none; 
        }

        button { 
            padding: 16px 20px; /* Buton büyütüldü */
            background: #00aa00; 
            color: white; 
            border: none; 
            border-bottom: 4px solid #004400; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 22px; /* Buton yazısı büyütüldü */
            font-weight: bold;
            text-shadow: 1px 1px #002200;
            transition: background 0.2s;
        }

        button:hover { 
            background: #55ff55; 
            color: #000; 
            border-bottom: 4px solid #00aa00; 
        }

        .error-message {
            color: #ff5555;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>⛏️ Market Girişi ⚔️</h2>
        
        <div id="errorBox" class="error-message"></div>

        <form id="loginForm">
            <label for="username">Minecraft Kullanıcı Adı:</label>
            <input type="text" id="username" placeholder="Örn: WeriqX" required autocomplete="off">
            
            <label for="password">Şifre:</label>
            <input type="password" id="password" placeholder="••••" required>
            
            <button type="submit" id="submitBtn">Giriş Yap</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            
            // Çift tıklamayı engellemek için butonu geçici olarak kilitleyelim
            submitBtn.disabled = true;
            submitBtn.innerText = "Giriş Yapılıyor...";
            errorBox.style.display = "none";

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            try {
                // Kendi Render backend adresinizle tam uyumlu istek alanı
                const res = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await res.json();

                if (res.ok) {
                    // Kullanıcı bilgilerini tarayıcı hafızasına kaydet ve yönlendir
                    localStorage.setItem('mc_user', data.username);
                    window.location.href = 'index.html';
                } else {
                    // Sunucudan gelen hata mesajını göster (Şifre yanlış vb.)
                    errorBox.innerText = data.message || "Giriş başarısız.";
                    errorBox.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Giriş Yap";
                }
            } catch (error) {
                // İnternet veya sunucu çökme hatası durumunda
                console.error("Bağlantı hatası:", error);
                errorBox.innerText = "Sunucuya bağlanılamadı! Lütfen Render panelinden sunucunun aktif olduğunu kontrol edin.";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Giriş Yap";
            }
        });
    </script>
</body>
</html>
