<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Market - Giriş Yap</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(16, 16, 16, 0.9), rgba(25, 25, 25, 0.9)), url('https://minecraft.net');
            background-repeat: repeat; 
            color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        } 
        .login-container {
            width: 100%;
            max-width: 500px;
            background: rgba(35, 35, 35, 0.95); 
            padding: 40px;
            border-radius: 12px; 
            border: 4px solid #4a4a4a;
            box-shadow: 0 12px 36px rgba(0,0,0,0.8);
            box-sizing: border-box;
            text-align: center;
        }
        h2 { 
            color: #55ff55; 
            text-shadow: 2px 2px #004400; 
            margin-top: 0; 
            font-size: 32px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 18px;
        }
        input { 
            display: block; 
            margin-bottom: 25px; 
            padding: 15px; 
            width: 100%; 
            box-sizing: border-box; 
            background: #1a1a1a; 
            color: #fff; 
            border: 2px solid #555; 
            border-radius: 6px; 
            font-size: 18px;
        }
        input:focus { border-color: #55ff55; outline: none; }
        button { 
            padding: 16px 20px;
            background: #00aa00; 
            color: white; 
            border: none; 
            border-bottom: 4px solid #004400; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px #002200;
        }
        button:hover { 
            background: #55ff55; 
            color: #000; 
            border-bottom: 4px solid #00aa00; 
        }
        .url-box {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>⛏️ Market Girişi ⚔️</h2>
        
        <!-- JavaScript yerine doğrudan güvenli sunucu yönlendirmesi kullanıyoruz -->
        <form action="/api/auth/login" method="POST">
            <label for="username">Minecraft Kullanıcı Adı:</label>
            <input type="text" id="username" name="username" placeholder="WeriqX" required autocomplete="off">
            
            <label for="password">Şifre:</label>
            <input type="password" id="password" name="password" placeholder="••••" required>
            
            <button type="submit">Giriş Yap</button>
        </form>
        <div class="url-box">weriqxmcsiparis.onrender.com</div>
    </div>

</body>
</html>
