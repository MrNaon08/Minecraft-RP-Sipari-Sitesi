<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Market - Giriş Yap</title>
    <style>body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding-top: 50px; } form { display: inline-block; background: #333; padding: 20px; border-radius: 8px; } input { display: block; margin: 10px 0; padding: 10px; width: 200px; }</style>
</head>
<body>
    <h2>Giriş Yap</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Minecraft Kullanıcı Adı" required>
        <input type="password" id="password" placeholder="Şifre" required>
        <button type="submit">Giriş Yap</button>
    </form>
    <p><a href="kayit.html" style="color:#aaa">Kayıt Ol</a></p>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('mc_user', data.username);
                window.location.href = 'index.html';
            } else { alert(data.message); }
        });
    </script>
</body>
</html>
